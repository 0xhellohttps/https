<!DOCTYPE html>
<html lang="en" style="color-scheme:dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>https</title>
<meta name="description" content="https — fast, secure, well-encrypted web. https-first, always.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23060606'/%3E%3Ctext x='50' y='64' font-family='ui-monospace,Menlo,monospace' font-size='44' font-weight='700' fill='%23ebebeb' text-anchor='middle'%3E%3E_%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@300..700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#060606; --panel:#101010; --panel-3:#262626; --fg:#ebebeb; --muted:#757575; --border:rgba(235,235,235,.2); --border-hover:rgba(235,235,235,.4); --green:#98f3aa;
    --sans:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; --pad-x:16px; }
  @media (min-width:768px){ :root{ --pad-x:48px; } }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; background:var(--bg); color:var(--fg); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }
  .mono{ font-family:var(--mono); font-size:14px; line-height:16px; letter-spacing:-.14px; text-transform:uppercase; }
  .muted{ color:var(--muted); }

  #world{ position:fixed; inset:0; width:100%; height:100%; border:0; display:block; background:var(--bg); }

  .ui{ position:fixed; inset:0; display:flex; flex-direction:column; justify-content:space-between; padding:16px var(--pad-x); pointer-events:none; }
  @media (min-width:768px){ .ui{ padding:20px var(--pad-x) 40px; } }
  .ui > *{ pointer-events:auto; }
  .top, .bottom{ display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand img{ width:30px; height:auto; filter:invert(1); mix-blend-mode:screen; }
  .brand span{ font-family:var(--mono); font-size:15px; letter-spacing:-.15px; }
  .brand span::after{ content:"_"; animation:blink 1.1s steps(1) infinite; }
  .label{ display:flex; align-items:center; gap:4px; }
  .label i{ display:block; width:11px; height:11px; background:var(--muted); }
  .label span{ font-family:var(--mono); font-size:14px; line-height:16px; letter-spacing:-.14px; text-transform:uppercase; color:var(--muted); }
  .label i.live{ background:var(--green); box-shadow:0 0 12px var(--green); }

  .wordmark{ display:block; width:100%; cursor:pointer; }
  .wordmark svg{ display:block; width:100%; height:auto; }
  .wordmark rect{ fill:#EBEBEB; transition:fill .25s ease; }
  .wordmark:hover rect, .wordmark:focus-visible rect{ fill:var(--green); }
  .wordmark:focus-visible{ outline:1px solid var(--green); outline-offset:8px; }
  @keyframes blink{ 0%,49%{opacity:1} 50%,100%{opacity:0} }
  @media (prefers-reduced-motion:reduce){ .brand span::after{ animation:none; } .wordmark rect{ transition:none; } }
</style>
</head>
<body>

<iframe id="world" title="The https globe, animated silently by the demo loop" allow="accelerometer; gyroscope"></iframe>
<script>
  /* Small world: 22% of the short viewport edge on desktop; a little larger on phones so it still reads as a globe. */
  document.getElementById("world").src = "visualizer.html?embed=1&silent=1&cell=10&wire=1&zoom=" + (window.innerWidth < 768 ? "0.42" : "0.22");
</script>

<div class="ui">
  <div class="top">
    <a class="brand" href="home.html" aria-label="https — home"><img src="logo.gif" alt=""><span>https</span></a>
  </div>
  <a class="wordmark" href="home.html" aria-label="Enter https">
    <svg id="lineLogo" role="img" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"></svg>
  </a>
</div>



<script>
(function(){
  window.addEventListener("keydown", function(e){ if (e.key === "Enter") location.href = "home.html"; });

  /* HTTPS bar-grid wordmark (same font as the site footer). Bars load in as full-width lines and resolve into letters. */
  var svg = document.getElementById("lineLogo");
  var U = 82, RP = 66, BH = 46, LW = 6, GAP = 1, ROWS = 5;
  var FONT = {
    H: [[[0,1],[5,1]], [[0,1],[5,1]], [[0,6]], [[0,1],[5,1]], [[0,1],[5,1]]],
    T: [[[0,6]], [[2,2]], [[2,2]], [[2,2]], [[2,2]]],
    P: [[[0,6]], [[0,1],[5,1]], [[0,6]], [[0,1]], [[0,1]]],
    S: [[[0,6]], [[0,1]], [[0,6]], [[5,1]], [[0,6]]]
  };
  var word = "HTTPS", totalU = word.length * LW + (word.length - 1) * GAP;
  svg.setAttribute("viewBox", "0 0 " + (totalU * U) + " " + ((ROWS - 1) * RP + BH));
  var bars = [], NS = "http://www.w3.org/2000/svg";
  for (var li = 0; li < word.length; li++){
    var rows = FONT[word[li]], sx = li * (LW + GAP) * U, sw = LW * U;
    for (var r = 0; r < ROWS; r++){
      rows[r].forEach(function(run){
        var el = document.createElementNS(NS, "rect");
        el.setAttribute("y", r * RP); el.setAttribute("height", BH);
        svg.appendChild(el);
        bars.push({ el: el, sx: sx, sw: sw, rx: sx + run[0] * U, rw: run[1] * U });
      });
    }
  }
  function expoOut(t){ return t >= 1 ? 1 : 1 - Math.pow(2, -10 * t); }
  function ease(t){ return t <= 0 ? 0 : 0.7 + 0.3 * expoOut(t); }     /* mpp's load-in curve: jumps to 70% then eases */
  function setBar(b, e, op){
    b.el.setAttribute("x", (b.sx + (b.rx - b.sx) * e).toFixed(1));
    b.el.setAttribute("width", (b.sw + (b.rw - b.sw) * e).toFixed(1));
    b.el.setAttribute("opacity", op.toFixed(3));
  }
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce){ bars.forEach(function(b){ setBar(b, 1, 1); }); return; }
  var mid = (bars.length - 1) / 2, DUR = 750, DELAY = 7, t0 = null;
  bars.forEach(function(b){ setBar(b, 0, 0); });
  function tick(now){
    if (t0 === null) t0 = now;
    var done = true;
    for (var i = 0; i < bars.length; i++){
      var t = (now - t0 - Math.abs(i - mid) * DELAY) / DUR; if (t < 1) done = false;
      var c = t < 0 ? 0 : (t > 1 ? 1 : t);
      setBar(bars[i], ease(c), c);
    }
    if (!done) requestAnimationFrame(tick);
  }
  setTimeout(function(){ requestAnimationFrame(tick); }, 350);
})();
</script>
</body>
</html>
